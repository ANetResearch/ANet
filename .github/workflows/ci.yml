name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: go test -race ./...

  # "Pluggable" is a property the build proves, not a claim in a design
  # document. v1's organisation feature was pluggable in exactly the same
  # sense — right up to the point where removing it took an axe and 683,852
  # deleted lines. Every module gets pulled on its own, and then all of them
  # together, on every commit.
  pluggable:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        tags:
          - "no_anetlink"
          # Reserved for the anet3 subsystems as they land. Each name is
          # claimed here first so the seam is enforced from the module's
          # first commit rather than retrofitted after it has spread:
          #   no_p2p         peer-to-peer transport
          #   no_blackboard  shared-brain coordination
          #   no_store       distributed storage
          #   no_org         organisation management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build without the module
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: test without the module
        run: go test -tags "${{ matrix.tags }}" ./...
      - name: the binary must still start
        run: |
          go build -tags "${{ matrix.tags }}" -o /tmp/anet ./cmd/anet
          /tmp/anet --help >/dev/null
      # Absent, not merely disabled. A tag that only skips a registration
      # while the code still links is pluggability in name only, and it is
      # what the first version of this seam actually shipped.
      - name: the module's code must be out of the binary
        run: |
          go build -o /tmp/anet-full ./cmd/anet
          go build -tags "${{ matrix.tags }}" -o /tmp/anet-lean ./cmd/anet
          mod="${{ matrix.tags }}"; mod="${mod#no_}"
          full=$(go tool nm /tmp/anet-full | grep -c "provider/$mod\|module/$mod" || true)
          lean=$(go tool nm /tmp/anet-lean | grep -c "provider/$mod\|module/$mod" || true)
          echo "$mod symbols: full=$full lean=$lean"
          test "$full" -gt 0 || (echo "the full build should contain $mod" && exit 1)
          test "$lean" -eq 0 || (echo "$mod is still linked into the lean build" && exit 1)
