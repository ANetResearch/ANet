name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: go test -race ./...

  # The opt-in tags, which are checked the other way round.
  #
  # Every module above is in by default and subtracted with `no_<name>`.
  # `shell` is the exception: it executes commands on the machine hosting
  # the daemon, so the default build must not contain it and a build must
  # ask. That inverts the assertion — the DEFAULT binary is the one whose
  # symbol count has to be zero — and inverts what a mistake costs. A
  # broken subtractive tag ships a module somebody wanted removed; a
  # broken opt-in tag ships command execution to everybody who never
  # asked for it, which is why it is a separate job rather than another
  # row in the matrix above.
  optin:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        tag: ["shell"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The default `go test ./...` cannot see tagged code at all, so
      # without this the module's own tests never run anywhere.
      - name: gofmt, vet and test with the module in
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet -tags "${{ matrix.tag }}" ./...
          go test -tags "${{ matrix.tag }}" ./...
      - name: the binary must still start both ways
        run: |
          go build -o /tmp/anet-default ./cmd/anet
          go build -tags "${{ matrix.tag }}" -o /tmp/anet-optin ./cmd/anet
          /tmp/anet-default --help >/dev/null
          /tmp/anet-optin --help >/dev/null
      - name: the module must be absent by default and present when asked
        run: |
          mod="${{ matrix.tag }}"
          pat="module/$mod"
          def=$(go tool nm /tmp/anet-default | grep -cE "$pat" || true)
          opt=$(go tool nm /tmp/anet-optin | grep -cE "$pat" || true)
          echo "$mod symbols: default=$def opt-in=$opt"
          test "$def" -eq 0 || (echo "$mod is linked into the DEFAULT build" && exit 1)
          test "$opt" -gt 0 || (echo "-tags $mod did not link $mod in" && exit 1)

  # "Pluggable" is a property the build proves, not a claim in a design
  # document. v1's organisation feature was pluggable in exactly the same
  # sense — right up to the point where removing it took an axe and 683,852
  # deleted lines. Every module gets pulled on its own, and then all of them
  # together, on every commit.
  pluggable:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        tags:
          - "no_anetlink"
          - "no_p2p"
          - "no_p2p,no_anetlink"
          - "no_blackboard"
          - "no_blackboard,no_p2p,no_anetlink"
          - "no_org"
          - "no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_cas"
          - "no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_service"
          - "no_mcp"
          - "no_x402"
          - "no_taskboard"
          - "no_x402,no_service,no_mcp,no_taskboard,no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          # The tag sets docs/DISTRIBUTIONS-zh.md proposes as shipping
          # variants. A design naming combinations nobody builds is a
          # design that will stop compiling without anyone noticing.
          - "no_x402,no_mcp,no_taskboard,no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_mcp,no_taskboard,no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_x402,no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_x402,no_mcp,no_cas,no_org,no_blackboard,no_anetlink"
          # Reserved for the anet3 subsystems as they land. Each name is
          # claimed here first so the seam is enforced from the module's
          # first commit rather than retrofitted after it has spread:
          #   no_p2p         peer-to-peer transport
          #   no_blackboard  shared-brain coordination
          #   no_store       distributed storage
          #   no_org         organisation management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build without the module
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: test without the module
        run: go test -tags "${{ matrix.tags }}" ./...
      - name: the binary must still start
        run: |
          go build -tags "${{ matrix.tags }}" -o /tmp/anet ./cmd/anet
          /tmp/anet --help >/dev/null
      # Absent, not merely disabled. A tag that only skips a registration
      # while the code still links is pluggability in name only, and it is
      # what the first version of this seam actually shipped.
      - name: the module's code must be out of the binary
        run: |
          go build -o /tmp/anet-full ./cmd/anet
          go build -tags "${{ matrix.tags }}" -o /tmp/anet-lean ./cmd/anet
          mod="${{ matrix.tags }}"; mod="${mod%%,*}"; mod="${mod#no_}"
          # Most modules live under module/ or provider/; the MCP
          # northbound lives at internal/mcpserv, so the pattern has to
          # name it. A symbol check that cannot see the code it is
          # checking passes for the wrong reason.
          pat="provider/$mod|module/$mod"
          [ "$mod" = mcp ] && pat="internal/mcpserv"
          full=$(go tool nm /tmp/anet-full | grep -cE "$pat" || true)
          lean=$(go tool nm /tmp/anet-lean | grep -cE "$pat" || true)
          echo "$mod symbols: full=$full lean=$lean"
          test "$full" -gt 0 || (echo "the full build should contain $mod" && exit 1)
          test "$lean" -eq 0 || (echo "$mod is still linked into the lean build" && exit 1)

  # A hub that knows nobody, and three nodes that join it.
  #
  # The unit suites prove each side against a fake of the other, which is
  # exactly where every defect this project has shipped was living. This
  # job runs the real thing: a hub on an empty directory, three daemons
  # with three identities that join the way the hub's own web page tells a
  # person to, and a capability call that crosses two processes and a
  # relay before its receipt is checked by a fourth party holding nothing
  # but files.
  #
  # Hermetic on purpose — loopback only, no secrets, no internet. The
  # richer version of this scenario (a local caption model in a container
  # on one node, a rented frontier model on another) lives in the same
  # script behind --live and runs on demand, because a test that needs an
  # API key cannot gate a merge: it fails when someone else's quota runs
  # out, and a test that fails for reasons outside the diff teaches people
  # to ignore it.
  scenario:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the binaries the scenario drives
        run: |
          mkdir -p /tmp/anet-scenario/bin
          go build -o /tmp/anet-scenario/bin/anet ./cmd/anet
          go build -o /tmp/anet-scenario/bin/anetfixture ./tools/anetfixture
          cd .hub && go build -o /tmp/anet-scenario/bin/anet-hub ./cmd/anet-hub
      - name: three nodes join a hub and use each other
        run: bash scripts/scenario.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 /tmp/anet-scenario/*.log /tmp/anet-scenario/*/.anet/daemon.log || true

  # Fleet control: one machine's agent tool driving anet nodes on several
  # machines. This is the path the daemon exists for in a multi-machine
  # setup, and it crosses three process boundaries — control daemon, hub,
  # worker daemons — so no unit test reaches it. The workers' coding agents
  # are stubbed: the real claude/codex/cursor/opencode need their own keys
  # and network, and what is under test here is the anet side.
  fleet:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      HUB_SRC: ${{ github.workspace }}/.hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: an agent tool drives three worker nodes
        run: bash scripts/joint-fleet.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 /tmp/joint-fleet/*.log || true
