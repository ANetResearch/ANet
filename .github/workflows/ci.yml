name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The joint job below runs only when asked; see there.
  workflow_dispatch:

# The Go jobs build exactly what go.mod names: the published ANetCore v0.16.1.
#
# Jobs that build the hub check ANetHub out at its release tag, v0.3.3, the
# hub of hub wire 3 that is released with this version. A hub of another
# wire and a daemon refuse each other, so the pin moves with a change of wire
# and with a hub release the suite ships together. The hub checkout builds
# against its own go.mod.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...
      # SI-38 at run time: TestDaemonNeverOpensRecoveryFile watches every
      # open of the recovery files with inotify, which only Linux has, and
      # skips that half elsewhere. This job runs on Linux, so here a skip is
      # a failure, and the run-time half must have passed.
      - name: the daemon opens no recovery file, watched at run time
        shell: bash
        run: |
          go test -count=1 -v -run '^TestDaemonNeverOpensRecoveryFile$' ./internal/daemon/ | tee /tmp/recoveryscope.out
          if grep -- '--- SKIP' /tmp/recoveryscope.out; then
            echo "a recovery file test skipped; here that is a failure" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestDaemonNeverOpensRecoveryFile/run_time' /tmp/recoveryscope.out \
            || { echo "the run-time recovery file check did not run" >&2; exit 1; }
      # SI-8: the kernel and the MCP server never depend on the A2A SDK,
      # whatever module/a2a does with it. On the import graph, not on a
      # binary, and in the no_a2a build too.
      - name: internal/daemon and internal/mcpserv do not reach a2a-go
        run: |
          bash scripts/tagcheck.sh deps
          bash scripts/tagcheck.sh deps no_a2a
      # The Windows port: every package builds and vets for windows/amd64
      # and windows/arm64, in the default build and with the shell module.
      # The tests themselves run on Windows, in the `windows` job.
      - name: build and vet for windows/amd64 and windows/arm64
        shell: bash
        run: |
          for a in amd64 arm64; do
            for t in "" shell; do
              echo "== windows/$a ${t:-default}"
              GOOS=windows GOARCH=$a go build -tags "$t" ./...
              GOOS=windows GOARCH=$a go vet -tags "$t" ./...
            done
          done

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        # -timeout: internal/daemon alone takes about 660-714 s under -race
        # on a developer machine, past go test's default 10-minute limit per
        # test binary (CONTRIBUTING.md, build.sh).
        run: |
          go test -race -timeout 45m ./...
          go test -race -tags shell ./module/shell/... ./cmd/anet/...

  # The opt-in tags, which are checked the other way round.
  #
  # Every module in the matrix below is in by default and subtracted with
  # `no_<name>`. `shell` is the exception: it executes commands on the
  # machine hosting the daemon (A2A-DESIGN §16), so the default build must
  # not contain it and a build must ask. That inverts the assertion — the
  # DEFAULT binary is the one whose symbol count has to be zero — and
  # inverts what a mistake costs. A
  # broken subtractive tag ships a module somebody wanted removed; a broken
  # opt-in tag ships the module to everybody who never asked for it, which
  # is why it is a separate job rather than another row in the matrix.
  optin:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        tag: ["shell"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The default `go test ./...` cannot see tagged code at all, so
      # without this the module's own tests never run anywhere.
      - name: gofmt, vet and test with the module in
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet -tags "${{ matrix.tag }}" ./...
          go test -tags "${{ matrix.tag }}" ./...
      - name: the binary must still start both ways
        run: |
          go build -o /tmp/anet-default ./cmd/anet
          go build -tags "${{ matrix.tag }}" -o /tmp/anet-optin ./cmd/anet
          /tmp/anet-default --help >/dev/null
          /tmp/anet-optin --help >/dev/null
      - name: the module must be absent by default and present when asked
        run: bash scripts/tagcheck.sh check "${{ matrix.tag }}"

  # "Pluggable" is a property the build proves, not a claim in a design
  # document. v1's organisation feature was pluggable in exactly the same
  # sense — right up to the point where removing it took an axe and 683,852
  # deleted lines. Every module gets pulled on its own, and then all of them
  # together, on every commit.
  pluggable:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        tags:
          - "no_anetlink"
          - "no_p2p"
          - "no_p2p,no_anetlink"
          - "no_blackboard"
          - "no_blackboard,no_p2p,no_anetlink"
          - "no_org"
          - "no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_cas"
          - "no_cas,no_org,no_blackboard,no_p2p,no_anetlink"
          - "no_service"
          - "no_mcp"
          - "no_x402"
          - "no_preview"
          - "no_autoreply"
          # Alone, so MCP stays in: the build an A2A-less agent tool uses.
          # The symbol pattern is the special case in scripts/tagcheck.sh
          # (module/a2a|a2aproject/a2a-go); until module/a2a is in the tree
          # only "nothing of it in the lean build" is checked.
          - "no_a2a"
          - "no_a2a,no_x402,no_service,no_mcp,no_cas,no_org,no_blackboard,no_p2p,no_anetlink,no_preview,no_autoreply"
          # The self-build recipes, as `bash scripts/tagcheck.sh recipes`
          # prints them; TestRecipesMatchCI compares these five rows with
          # that output (full is the default build and takes no tags).
          # A design naming combinations nobody builds is a design that
          # will stop compiling without anyone noticing.
          - "no_a2a,no_anetlink,no_autoreply,no_blackboard,no_cas,no_mcp,no_org,no_p2p,no_preview,no_service,no_x402"
          - "no_anetlink,no_autoreply,no_blackboard,no_cas,no_mcp,no_org,no_p2p,no_preview,no_x402"
          - "no_anetlink,no_autoreply,no_blackboard,no_cas,no_mcp,no_org,no_p2p,no_preview"
          - "no_anetlink,no_autoreply,no_blackboard,no_cas,no_org,no_p2p,no_preview,no_x402"
          - "no_anetlink,no_autoreply,no_blackboard,no_cas,no_mcp,no_org,no_preview,no_x402"
          # Reserved for the anet3 subsystems as they land. Each name is
          # claimed here first so the seam is enforced from the module's
          # first commit rather than retrofitted after it has spread:
          #   no_p2p         peer-to-peer transport
          #   no_blackboard  shared-brain coordination
          #   no_store       distributed storage
          #   no_org         organisation management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and vet without the module
        run: |
          go build -tags "${{ matrix.tags }}" ./...
          go vet -tags "${{ matrix.tags }}" ./...
      - name: test without the module
        run: go test -tags "${{ matrix.tags }}" ./...
      # Without the service module no provider takes files (CUX-F15): the
      # file admission, discard and allow_only tests run on their own here.
      - name: files without the service module
        if: matrix.tags == 'no_service'
        run: go test -tags no_service ./internal/daemon -run 'Files|Discard|AllowOnly|NoteReason' -timeout 30m
      - name: the binary must still start
        run: |
          go build -tags "${{ matrix.tags }}" -o /tmp/anet ./cmd/anet
          /tmp/anet --help >/dev/null
      # Absent, not merely disabled. A tag that only skips a registration
      # while the code still links is pluggability in name only, and it is
      # what the first version of this seam actually shipped. Every module
      # a row names is checked, not only the first: the step this replaces
      # proved x402 gone from the all-out row and nothing about the other
      # eight.
      - name: every module the row names is out of the binary
        run: bash scripts/tagcheck.sh check "${{ matrix.tags }}"
      # Without the preview module the previews of a reply are absent, not
      # merely off: the kernel's own tests run with the tag (frames dropped
      # and counted, nothing declared, nothing requested).
      - name: previews without the preview module
        if: matrix.tags == 'no_preview'
        run: go test -tags no_preview ./internal/daemon ./module/a2a ./cmd/anet -timeout 60m

  # The sandbox the exec auto-reply runs agents in (bubblewrap). Its
  # integration test skips when bwrap is missing or cannot create
  # namespaces, and a stock runner has no bwrap and restricts unprivileged
  # user namespaces — so everywhere else "fails closed in both directions"
  # has never actually run. Here a skip is a failure.
  #
  # Who is on the other end of a Unix socket (internal/peercred, LEC PC-1):
  # the tests that put a second account there — root listening on a socket
  # file this user owns (J10: refused, then accepted with peer_check
  # "path-only"), another user connecting to anetpeer's daemon socket — on
  # Linux (SO_PEERCRED) and macOS (LOCAL_PEERCRED). The hosted runners have
  # passwordless sudo and python3; ANET_TEST_SUDO=1 makes the tests use
  # them, and a skip here is a failure.
  peercred:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      ANET_TEST_SUDO: "1"
      # The tests make their sockets under t.TempDir(). macOS's own TMPDIR
      # (/var/folders/…/T/) plus a test's name passes the 104 bytes a socket
      # path may have there, and every bind would fail.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: another account on the far end of a socket, none skipped
        shell: bash
        run: |
          go test -count=1 -v -run 'AnotherAccount|ThatIsNotTheExpectedUser|PlatformThatCannotTell|NothingDials|SessionWriteHasADeadline' \
            ./internal/peercred/ ./internal/backendconn/ ./tools/anetpeer/ ./module/p2p/ | tee /tmp/peercred.out
          if grep -- '--- SKIP' /tmp/peercred.out; then
            echo "a peercred test skipped; here that is a failure" >&2
            exit 1
          fi
          for t in TestOfReportsAListenerOfAnotherAccount TestOfReportsAClientOfAnotherAccount \
                   TestAListenerOfAnotherAccountIsRefusedUnlessPathOnly TestADaemonSocketConnectionOfAnotherAccountIsClosed; do
            grep -q -- "--- PASS: $t" /tmp/peercred.out || { echo "$t did not run" >&2; exit 1; }
          done

  # The macOS sandbox (Seatbelt, LEC §4.3.8 MS-7): the self-check's five
  # items, the agent confined in the real sandbox, the keychain out of its
  # reach (a cgo helper looks up the security daemon's Mach service from
  # inside), what Seatbelt allows by default refused, what the agent leaves
  # in its process group ended with the run, and the profile vector. A release gate: a skip here is a failure, and
  # each test's PASS line is required, so a -run pattern that matched
  # nothing cannot pass. TMPDIR is short for the Unix socket the
  # confinement test puts in its data directory (104 bytes at most here).
  seatbelt:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      TMPDIR: /tmp
      # The packages the sandbox tests live in, twice (see the `sandbox` job).
      SANDBOX_PKGS: ./module/autoreply/... ./internal/daemon/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # J8's subset runs the real claude in the sandbox against a scripted model service on this host
      # (TestSeatbeltClaudeCompletesATask); nothing reaches a real model service.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: the claude CLI
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.295
          echo "ANET_TEST_CLAUDE=$(command -v claude)" >> "$GITHUB_ENV"
      - name: the Seatbelt sandbox on this Mac, none skipped
        shell: bash
        run: |
          go test -count=1 -v -timeout 30m -run 'Seatbelt|Darwin' $SANDBOX_PKGS | tee /tmp/seatbelt.out
          if grep -- '--- SKIP' /tmp/seatbelt.out; then
            echo "a Seatbelt test skipped; here that is a failure" >&2
            exit 1
          fi
          for t in TestSeatbeltProbeFiveItems TestSeatbeltIntegrationConfinesTheAgent \
                   TestSeatbeltIntegrationReachesTheModelOnlyThroughTheNode TestSeatbeltIntegrationHoldsNoSecret \
                   TestSeatbeltKeychainIsOutOfReach TestSeatbeltEndsWhatTheAgentLeftInItsGroup \
                   TestSeatbeltRefusesWhatItWouldAllowByDefault \
                   TestSeatbeltProfileGolden TestSeatbeltMachServicesAvoidForbiddenNames TestSeatbeltExecSystemIsReadable \
                   TestSeatbeltLaunchRunsTheAgentThroughTheKeyedEndpoint TestDarwinAgentConfigsCarryTheKeyedRoute \
                   TestSeatbeltClaudeCompletesATask TestSeatbeltPythonRuntimeOutsideTheExecutableSystem \
                   TestSeatbeltLaunchShowsAPythonEnvironment; do
            grep -q -- "--- PASS: $t" /tmp/seatbelt.out || { echo "$t did not run" >&2; exit 1; }
          done
      - name: init, the keyed egress endpoint and doctor on macOS
        run: go test -count=1 -run 'SandboxInit|SandboxSpec|EgressKeyed|EgressUnkeyed|SandboxEgressEnv|Doctor' ./module/autoreply/ ./internal/daemon/ ./cmd/anet/
      - name: the agents' configurations and command lines on macOS
        run: go test -count=1 -run 'UpstreamCombinationsFailClosed|SystemPromptStartingWithADash|AgentSandbox|AgentCommandLines|EgressUpstream|UnsupportedAgentsFailClosed' ./module/autoreply/ ./internal/daemon/

  # Native Windows, on a real Windows runner: vet, the TestWindows... tests
  # of the packages the port changes (private files and their access control
  # lists, process trees in a job object, names, the loopback guard, the
  # listener challenge, the agent configurations, the backend refusals, the
  # daemon, auto-reply, p2p, the service and anet-official token files, the
  # shell module, the replacement of a running anet.exe and the CLI), and the
  # installer: install.ps1 must parse in
  # Windows PowerShell 5.1 and in PowerShell 7, and test-install.ps1 checks its
  # functions in both. The Go steps run in bash so that the first failing
  # command fails the step.
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet, default and shell
        shell: bash
        run: |
          go vet ./...
          go vet -tags shell ./...
      - name: the Windows tests
        shell: bash
        run: |
          # Both runs always happen, so that one failing package does not hide the other's results.
          rc=0
          go test -count=1 -run Windows ./internal/fsperm ./internal/procgroup ./internal/pathsafe ./internal/anethome \
            ./internal/loopguard ./internal/localpeer ./internal/agentwire ./internal/backendconn ./internal/daemon \
            ./module/autoreply ./module/p2p ./module/service ./internal/release ./cmd/anet ./cmd/anet-official || rc=1
          go test -count=1 -tags shell -run Windows ./module/shell ./cmd/anet || rc=1
          exit $rc
      - name: install.ps1 in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'deploy\release\install.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Output ('install.ps1:{0}: {1}' -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\release\test-install.ps1
          exit $LASTEXITCODE
      - name: install.ps1 in PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'deploy\release\install.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Output ('install.ps1:{0}: {1}' -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          pwsh -NoProfile -File deploy\release\test-install.ps1
          exit $LASTEXITCODE

  # A release of this commit for Windows, for the windows-install job. It is
  # built with build-release.sh --unsigned from a local commit that replaces
  # internal/release/allowed_signers with a key made in this job, and signed
  # with that key; the private key is deleted at the end of the step, and the
  # local commit is never pushed. The binaries trust that key alone, so the
  # artifact (kept one day) can install nothing a release key signed, and a
  # release built from the repository trusts nothing this job made. dist/
  # also gets install.ps1 with the fingerprint of the key, and dist-legacy/
  # the stand-in for anet 1.1.15 (deploy/release/testdata/legacy-anet).
  windows-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: a Windows release of this commit, signed with a key made for this run
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ci-release-key"
          ns=anet-release@agentnetwork.org.cn
          ssh-keygen -q -t ed25519 -N '' -C ci-release-key -f "$key"
          printf '%s namespaces="%s,%s" %s\n' "$ns" "$ns" anet-official@agentnetwork.org.cn "$(cut -d' ' -f1,2 "$key.pub")" \
            > internal/release/allowed_signers
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -am "CI only: trust the key of this run"
          ./deploy/release/build-release.sh --unsigned windows-amd64 windows-arm64
          ssh-keygen -Y sign -f "$key" -n "$ns" dist/release.json
          ssh-keygen -Y verify -f internal/release/allowed_signers -I "$ns" -n "$ns" -s dist/release.json.sig < dist/release.json
          fp="$(ssh-keygen -lf "$key.pub" | awk '{print $2}')"
          sed -i "s|^\$AnetReleaseKeyFingerprint = '.*'\$|\$AnetReleaseKeyFingerprint = '$fp'|" dist/install.ps1
          grep -qxF "\$AnetReleaseKeyFingerprint = '$fp'" dist/install.ps1
          rm -f "$key"
          GOOS=windows GOARCH=amd64 go build -o dist-legacy/anet.exe ./deploy/release/testdata/legacy-anet
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          retention-days: 1
          path: |
            dist
            dist-legacy

  # install.ps1 end to end on windows-latest (an elevated account), started
  # with the published command from four shells: cmd.exe, Windows PowerShell
  # 5.1, PowerShell 7 and Git Bash. The command is the published one with
  # the address of a local server for install.ps1 (the download host serves
  # it the same way, as text/plain) and with -Controller, -Base (the local
  # release of windows-dist) and -NoJoin: nothing is downloaded from another
  # host and no hub is contacted. Before the first run, an earlier anet
  # (npm 1.1.15) and its data are planted, and the first run must take them
  # over. After each run, test-install-e2e.ps1 checks the grant in
  # config.json and peers.allow, the Run value, the PATH, the private
  # install directory and anet version, and what the run printed: the short
  # summary (with the takeover in one line on the first run, none after),
  # whose last line names the log of the run, which must exist in the logs
  # directory of the data directory, be private and hold the details. No
  # console input is available to the runs: one that asked a question would
  # fail or hang.
  windows-install:
    needs: windows-dist
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CI_AID: bafyreie6k7xot2qpitfcoseuevnuq7zcztdpdgx4coe3p2jlqjjl65hqu4
      LEGACY_ANET_MARK: C:\anet-ci\legacy-stopped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: C:\anet-ci
      - name: serve install.ps1 on 127.0.0.1 as text/plain
        shell: pwsh
        run: |
          $code = @(
            'import functools, http.server as h',
            'h.SimpleHTTPRequestHandler.extensions_map[".ps1"] = "text/plain; charset=utf-8"',
            'handler = functools.partial(h.SimpleHTTPRequestHandler, directory=r"C:\anet-ci\dist")',
            'h.ThreadingHTTPServer(("127.0.0.1", 8719), handler).serve_forever()'
          ) -join "`n"
          [IO.File]::WriteAllText('C:\anet-ci\serve.py', $code)
          $p = Start-Process -FilePath python -ArgumentList 'C:\anet-ci\serve.py' -PassThru -WindowStyle Hidden
          "HTTP_PID=$($p.Id)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          for ($i = 0; $i -lt 30; $i++) {
            try { $null = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8719/install.ps1; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          exit 1
      - name: an earlier anet (npm @agentnetwork/anet 1.1.15) and its data
        shell: pwsh
        run: deploy\release\test-install-e2e.ps1 -Plant -LegacyExe C:\anet-ci\dist-legacy\anet.exe
      - name: the published command in cmd.exe, taking over from the earlier anet
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; & ([scriptblock]::Create((irm -UseBasicParsing http://127.0.0.1:8719/install.ps1))) -Controller bafyreie6k7xot2qpitfcoseuevnuq7zcztdpdgx4coe3p2jlqjjl65hqu4 -Base C:\anet-ci\dist -NoJoin" > C:\anet-ci\out-cmd.txt
          set rc=%ERRORLEVEL%
          type C:\anet-ci\out-cmd.txt
          exit /b %rc%
      - name: what the run in cmd.exe installed, took over and printed
        shell: pwsh
        run: deploy\release\test-install-e2e.ps1 -Verify -Takeover -Aid $env:CI_AID -Output C:\anet-ci\out-cmd.txt
      - name: the published command in Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; & ([scriptblock]::Create((irm -UseBasicParsing http://127.0.0.1:8719/install.ps1))) -Controller bafyreie6k7xot2qpitfcoseuevnuq7zcztdpdgx4coe3p2jlqjjl65hqu4 -Base C:\anet-ci\dist -NoJoin" | Tee-Object -FilePath C:\anet-ci\out-ps51.txt
      - name: what the run in Windows PowerShell 5.1 installed and printed
        shell: pwsh
        run: deploy\release\test-install-e2e.ps1 -Verify -Aid $env:CI_AID -Output C:\anet-ci\out-ps51.txt
      - name: the published command in PowerShell 7
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; & ([scriptblock]::Create((irm -UseBasicParsing http://127.0.0.1:8719/install.ps1))) -Controller bafyreie6k7xot2qpitfcoseuevnuq7zcztdpdgx4coe3p2jlqjjl65hqu4 -Base C:\anet-ci\dist -NoJoin" | Tee-Object -FilePath C:\anet-ci\out-ps7.txt
      - name: what the run in PowerShell 7 installed and printed
        shell: pwsh
        run: deploy\release\test-install-e2e.ps1 -Verify -Aid $env:CI_AID -Output C:\anet-ci\out-ps7.txt
      - name: the published command in Git Bash
        shell: bash
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; & ([scriptblock]::Create((irm -UseBasicParsing http://127.0.0.1:8719/install.ps1))) -Controller bafyreie6k7xot2qpitfcoseuevnuq7zcztdpdgx4coe3p2jlqjjl65hqu4 -Base C:\anet-ci\dist -NoJoin" | tee /c/anet-ci/out-bash.txt
      - name: what the run in Git Bash installed and printed
        shell: pwsh
        run: deploy\release\test-install-e2e.ps1 -Verify -Aid $env:CI_AID -Output C:\anet-ci\out-bash.txt
      - name: stop the node and the local server
        if: always()
        shell: pwsh
        run: |
          deploy\release\test-install-e2e.ps1 -Cleanup
          if ($env:HTTP_PID) { Stop-Process -Id ([int]$env:HTTP_PID) -ErrorAction SilentlyContinue }

  # install.sh of this commit takes over a real AgentNetwork 1.1.15 (the npm
  # package @agentnetwork/anet, the release the owner reported as left in
  # place on macOS) with its daemon running. The script is piped to sh as in
  # the published command; it installs the release currently published on
  # the download host, verified with the release key. Checks: the 1.x daemon
  # is stopped, the npm package is gone, the data directory is renamed and
  # nothing is deleted, and a new login shell of the account's own shell
  # runs the new anet.
  unix-upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    # bash -eo pipefail: a failed installer fails the step through the tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: AgentNetwork 1.1.15 from npm, with its daemon and data
        run: |
          set -eu
          npm install -g @agentnetwork/anet@1.1.15
          command -v anet
          anet version | tee /tmp/legacy-version
          grep -q '1\.1\.15' /tmp/legacy-version
          # Most 1.x verbs start the daemon; give it 30 s.
          perl -e 'alarm 30; exec @ARGV' anet status || true
          ls -la ~/.anet
          echo "LEGACY_NPM_PREFIX=$(npm prefix -g)" >> "$GITHUB_ENV"
      # The published release, from the sources install.sh picks (npmmirror,
      # GitHub, ...). --no-join: CI never registers a node on the public hub.
      - name: install.sh of this commit, piped to sh
        run: |
          set -eu
          cat deploy/release/install.sh | sh -s -- --no-join > /tmp/install.out 2> /tmp/install.err
          cat /tmp/install.out /tmp/install.err
          # The concise output (spec C/E): a few lines, the summary block,
          # the takeover line, and the log named last.
          test "$(wc -l < /tmp/install.out | tr -d ' ')" -le 12
          grep -Eq '^Downloaded anet [0-9.]+ for [a-z0-9-]+ from (npmmirror|GitHub|npmjs|jsDelivr|agentnetwork\.org\.cn|hub\.agentnetwork\.org\.cn) \(' /tmp/install.out
          grep -q '^Replacing AgentNetwork 1\.1\.15$' /tmp/install.out
          grep -Eq '^anet [0-9.]+ is installed and running\.$' /tmp/install.out
          grep -Eq '^  AID   [a-z0-9]{40,}$' /tmp/install.out
          grep -q '^  Hub   not joined (--no-join)$' /tmp/install.out
          grep -q '^Replaced AgentNetwork 1\.1\.15; its data is kept in ~/\.anet-legacy-1\.1\.15-' /tmp/install.out
          tail -n 1 /tmp/install.out | grep -Eq "Details: ~/\.anet/logs/install-[0-9]{8}T[0-9]{6}Z\.log$"
          if grep -Eq 'Next:|doctor|Upgraded from|Daemons already running' /tmp/install.out; then
            echo "details in the summary"; exit 1
          fi
          test ! -s /tmp/install.err
      - name: the log holds the details, privately
        run: |
          set -eu
          log="$(ls ~/.anet/logs/install-*.log)"
          test "$(echo "$log" | wc -l | tr -d ' ')" = 1
          case "$(uname -s)" in Darwin) mode() { stat -f '%Lp' "$1"; } ;; *) mode() { stat -c '%a' "$1"; } ;; esac
          test "$(mode ~/.anet/logs)" = 700
          test "$(mode "$log")" = 600
          grep -q 'signature ok' "$log"
          grep -q 'sha256 ok (.gz and binary)' "$log"
          grep -q 'stopping the daemon of AgentNetwork 1.1.15' "$log"
          grep -q 'anet init' "$log"
          grep -q 'Upgraded from anet 1.1.15' "$log"
          grep -Eq '^using (npmmirror|GitHub|npmjs|jsDelivr|agentnetwork\.org\.cn|hub\.agentnetwork\.org\.cn): anet ' "$log"
          ~/.local/bin/anet status
      - name: what was taken over
        run: |
          set -eu
          ls -d ~/.anet-legacy-1.1.15-* 
          ls ~/.anet-legacy-1.1.15-*/api_token
          if npm ls -g --depth=0 @agentnetwork/anet 2>/dev/null | grep -q '@agentnetwork/anet@1\.'; then
            echo "npm package 1.x is still installed"; exit 1
          fi
          if nc -z 127.0.0.1 3998 2>/dev/null; then echo "the 1.x daemon still listens on 3998"; exit 1; fi
          sh_login="$(basename "${SHELL:-/bin/sh}")"
          case "$sh_login" in zsh|bash) ;; *) sh_login=bash ;; esac
          out="$(perl -e 'alarm 20; exec @ARGV' "$sh_login" -lic 'command -v anet; anet version' </dev/null)"
          echo "$out"
          echo "$out" | head -n1 | grep -qx "$HOME/.local/bin/anet"
          echo "$out" | grep -q '^anet 0\.[3-9]'
          old="$LEGACY_NPM_PREFIX/bin/anet"
          if [ -e "$old" ] || [ -L "$old" ]; then
            if [ -L "$old" ]; then t="$(readlink "$old")"; echo "$old -> $t"; case "$t" in *"/.local/bin/anet") ;; *) echo "earlier launcher left in place"; exit 1 ;; esac
            else echo "earlier launcher left in place"; exit 1; fi
          fi
      - name: a second run changes nothing and reports no takeover
        run: |
          set -eu
          cat deploy/release/install.sh | sh -s -- --no-join 2>&1 | tee /tmp/install2.out
          if grep -Eq '^Replac(ing|ed) ' /tmp/install2.out; then exit 1; fi
          grep -Eq '^anet [0-9.]+ is installed and running\.$' /tmp/install2.out
          test "$(ls -d ~/.anet-legacy-* | wc -l | tr -d ' ')" = 1
          ~/.local/bin/anet stop --all

  # The platforms the release builds for, and one it does not: peercred is
  # read on Linux, macOS and FreeBSD, and on OpenBSD everything builds and
  # every Unix socket backend fails closed (peer_cred_unsupported).
  cross:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and vet for darwin, freebsd and openbsd
        run: |
          for os in darwin freebsd openbsd; do
            echo "== $os"
            GOOS=$os go build ./...
            GOOS=$os go vet ./internal/peercred/... ./internal/backendconn/ ./tools/anetpeer/ ./module/p2p/
            GOOS=$os go test -c -o /dev/null ./internal/peercred
            GOOS=$os go test -c -o /dev/null ./internal/backendconn
            GOOS=$os go vet ./module/autoreply/ ./internal/daemon/ ./cmd/anet/
            GOOS=$os go test -c -o /dev/null ./internal/daemon
            GOOS=$os go test -c -o /dev/null ./module/autoreply
          done

  # C1-1 across the two repositories: the C1 v1 golden vectors in
  # provider/anetlink/testdata/c1v1 are byte for byte ANetLink's, at the
  # ANetLink release that ANETLINK_REF names. anet and ANetLink are built on
  # different ANetCore versions, and each encodes and decodes these bytes
  # with its own (provider/anetlink/golden_test.go here, northbound/c1serv
  # there); this job holds the two copies equal. A difference is never fixed
  # by copying one side over the other: it is a wire change, made in both
  # repositories, and ANETLINK_REF moves with it.
  c1-golden-xrepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the ANetLink release the vectors come from
        id: ref
        run: echo "ref=$(head -n 1 provider/anetlink/testdata/c1v1/ANETLINK_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetLink
          ref: ${{ steps.ref.outputs.ref }}
          path: .anetlink
      - name: the two copies are the same files, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          ours=provider/anetlink/testdata/c1v1
          theirs=.anetlink/northbound/c1serv/testdata/c1v1
          (cd "$ours" && sha256sum -c --quiet SHA256SUMS)
          (cd "$theirs" && sha256sum -c --quiet SHA256SUMS)
          diff <(cd "$ours" && ls | grep -vx ANETLINK_REF) <(cd "$theirs" && ls)
          for f in "$theirs"/*; do cmp "$f" "$ours/$(basename "$f")"; done
          echo "C1-1: $(ls "$theirs" | wc -l) files, the same in both repositories"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: each side's Go test, the cross-repository one not skipped
        shell: bash
        run: |
          ANETLINK_DIR="$PWD/.anetlink" go test -count=1 -v -run 'C1Golden|StrictDecoderIsANetLinks' ./provider/anetlink/ | tee /tmp/c1golden.out
          if grep -- '--- SKIP' /tmp/c1golden.out; then
            echo "a C1-1 test skipped; here that is a failure" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestC1GoldenIsANetLinks' /tmp/c1golden.out || { echo "TestC1GoldenIsANetLinks did not run" >&2; exit 1; }

  # The Linux sandbox (LEC §4.3.2 SB-1 to SB-6). A release gate: a skip is a failure, and each
  # listed test's PASS line is required, so a -run pattern that matched nothing cannot pass.
  #
  # It runs twice. On the hosted runner (Ubuntu with AppArmor's restriction on user namespaces left as it
  # is: the profile anet ships, `anet doctor --apparmor-profile`, is what lets bubblewrap work, and no
  # sysctl is changed), and in a Debian 12 container (bubblewrap 0.8, a non-root user), which is the oldest
  # host anet supports.
  #
  # SANDBOX_PKGS names the packages the sandbox tests live in, twice: the auto-reply module and the kernel,
  # which run the same -run filter, because tests that stay in internal/daemon still hold Sandbox cases.
  # The Debian 12 leg runs the module's test binary only.
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        where: [host, debian12]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      SANDBOX_PKGS: ./module/autoreply/... ./internal/daemon/
      SANDBOX_RUN: Sandbox|Bwrap|Seccomp
      SANDBOX_MUST_PASS: >-
        TestSandboxIntegrationConfinesTheAgent TestSandboxIntegrationConfiguresEachAgent
        TestSandboxProbeSixItems TestSandboxProbeSeccompAloneRefusesUserNamespaces
        TestSandboxDiskWatchKillsTheRun TestSeccompFilterInKernel TestSandboxOutboxLinkSendsNothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The host: bubblewrap, the profile from this tree, and a user systemd for the resource-limit tests
      # (TestTheUserScopeOnThisHost skips without one).
      - name: bubblewrap, and the profile that lets it make user namespaces
        if: matrix.where == 'host'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          go run ./cmd/anet doctor --apparmor-profile | sudo tee /etc/apparmor.d/anet-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/anet-bwrap
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      # `shell: bash` for pipefail. A step with no shell runs `bash -e`, where a pipeline's status is tee's,
      # so a failing sandbox test would pass here as long as it did not skip. The SKIP test is an explicit
      # exit because errexit ignores a `! cmd` that fails anywhere but last.
      - name: the sandbox tests run on the host, none skipped
        if: matrix.where == 'host'
        shell: bash
        run: |
          go test -count=1 -v -timeout 30m -run "$SANDBOX_RUN|TheUserScopeOnThisHost|RunsGetAUserScope" $SANDBOX_PKGS | tee /tmp/sandbox.out
          if grep -- '--- SKIP' /tmp/sandbox.out; then
            echo "a sandbox test skipped; here that is a failure" >&2
            exit 1
          fi
          for t in $SANDBOX_MUST_PASS TestTheUserScopeOnThisHost; do
            grep -q -- "--- PASS: $t" /tmp/sandbox.out || { echo "$t did not run" >&2; exit 1; }
          done
      # The test binary is built here (static, CGO_ENABLED=0) and run in the container as a user that is
      # not root, with the host's seccomp and /proc left unrestricted for the container (bubblewrap makes
      # its own namespaces) and an AppArmor profile that allows user namespaces (the container's processes
      # fall under the same restriction as the host's).
      - name: the sandbox tests run in Debian 12 as a non-root user, none skipped
        if: matrix.where == 'debian12'
        shell: bash
        run: |
          mkdir -p /tmp/sbtest
          go test -c -o /tmp/sbtest/autoreply.test ./module/autoreply/
          sudo tee /etc/apparmor.d/anet-ci-userns >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile anet-ci-userns flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/anet-ci-userns
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=anet-ci-userns \
            -v "$PWD":/src:ro -v /tmp/sbtest:/sbtest:ro \
            -e SANDBOX_RUN -e SANDBOX_MUST_PASS \
            debian:12 sh -ec '
              apt-get update -qq
              apt-get install -y -qq bubblewrap >/dev/null
              bwrap --version
              useradd -m -u 1001 tester
              cd /src/module/autoreply
              su tester -c "/sbtest/autoreply.test -test.count=1 -test.v -test.timeout 30m -test.run \"$SANDBOX_RUN\"" > /tmp/sandbox.out 2>&1 || { cat /tmp/sandbox.out; exit 1; }
              cat /tmp/sandbox.out
              if grep -- "--- SKIP" /tmp/sandbox.out; then echo "a sandbox test skipped; here that is a failure" >&2; exit 1; fi
              for t in $SANDBOX_MUST_PASS; do
                grep -q -- "--- PASS: $t" /tmp/sandbox.out || { echo "$t did not run" >&2; exit 1; }
              done
            '

  # The tests whose premise is the machine (a user that is not root, an interpreter with the reference SDK,
  # a build without a feature): every one of them runs here, and a skip is a failure. The premises
  # that other jobs meet: a second account and passwordless sudo are `peercred`'s; the macOS-only ones are
  # `seatbelt`'s; user systemd is `sandbox`'s on the host; the 3 tests that skip under the no_x402 build
  # run in `test`, which builds without it; ANetHub's identity_ops_test.go runs as a non-root user in its
  # own repository's `test` job, which is this runner's user too.
  premises:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the reference A2A SDK
        run: |
          python -m venv /tmp/a2avenv
          /tmp/a2avenv/bin/pip install --quiet "a2a-sdk[signing]"
          echo "ANET_A2A_PYTHON=/tmp/a2avenv/bin/python" >> "$GITHUB_ENV"
      - name: tests that need a user that is not root, or the reference SDK, none skipped
        shell: bash
        run: |
          [ "$(id -u)" != 0 ] || { echo "this job must run as a user that is not root" >&2; exit 1; }
          go test -count=1 -v -run 'TestRemoveWorkTreeTakesAnUnreadableTop|TestTheDiskWatchCannotBeHiddenFrom' ./module/autoreply/ | tee /tmp/premises.out
          go test -count=1 -v -run 'TestAPolicyWriteThatFailedToSaveIsNotInForce|TestPublicCapabilitiesAndAutoReplyWritesThatFailedToSaveAreNotInForce' ./internal/daemon/ | tee -a /tmp/premises.out
          go test -count=1 -v -run 'TestExtCard1VerifiesInA2APython' ./internal/netcard/ | tee -a /tmp/premises.out
          if grep -- '--- SKIP' /tmp/premises.out; then
            echo "a test skipped for its premise; here that is a failure" >&2
            exit 1
          fi
          for t in TestRemoveWorkTreeTakesAnUnreadableTop TestTheDiskWatchCannotBeHiddenFrom TestAPolicyWriteThatFailedToSaveIsNotInForce \
                   TestPublicCapabilitiesAndAutoReplyWritesThatFailedToSaveAreNotInForce TestExtCard1VerifiesInA2APython; do
            grep -q -- "--- PASS: $t" /tmp/premises.out || { echo "$t did not run" >&2; exit 1; }
          done

  # A hub that knows nobody, and three nodes that join it.
  #
  # The unit suites prove each side against a fake of the other, which is
  # exactly where every defect this project has shipped was living. This
  # job runs the real thing: a hub on an empty directory, three daemons
  # with three identities that join the way the hub's own web page tells a
  # person to, and a capability call that crosses two processes and a
  # relay before its receipt is checked by a fourth party holding nothing
  # but files.
  #
  # Hermetic on purpose — loopback only, no secrets, no internet. The
  # richer version of this scenario (a local caption model in a container
  # on one node, a rented frontier model on another) lives in the same
  # script behind --live and runs on demand, because a test that needs an
  # API key cannot gate a merge: it fails when someone else's quota runs
  # out, and a test that fails for reasons outside the diff teaches people
  # to ignore it.
  scenario:
    runs-on: ubuntu-latest
    # Section 8 waits out the daemon's ten-minute key cache once; the whole run takes about half an hour.
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          ref: v0.3.3   # pinned; see the note at the top
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the binaries the scenario drives
        run: |
          mkdir -p /tmp/anet-scenario/bin
          go build -o /tmp/anet-scenario/bin/anet ./cmd/anet
          go build -o /tmp/anet-scenario/bin/anetfixture ./tools/anetfixture
          cd .hub && go build -o /tmp/anet-scenario/bin/anet-hub ./cmd/anet-hub
      - name: three nodes join a hub and use each other
        run: bash scripts/scenario.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 /tmp/anet-scenario/*.log /tmp/anet-scenario/*/.anet/daemon.log || true

  # Fleet control: one machine's agent tool driving anet nodes on several
  # machines. This is the path the daemon exists for in a multi-machine
  # setup, and it crosses three process boundaries — control daemon, hub,
  # worker daemons — so no unit test reaches it. The workers' coding agents
  # are stubbed: the real claude/codex/cursor/opencode need their own keys
  # and network, and what is under test here is the anet side.
  fleet:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      HUB_SRC: ${{ github.workspace }}/.hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          ref: v0.3.3   # pinned; see the note at the top
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: an agent tool drives three worker nodes
        run: bash scripts/joint-fleet.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 /tmp/joint-fleet/*.log || true

  # The shell module across a real hub (A2A-DESIGN §16: joint-shell.sh in
  # CI). Its unit tests construct provider.Call themselves, so only a real
  # delegation shows that the CallerAID reaching Invoke is the caller's
  # verified identity. Self-contained: builds a -tags shell daemon and the
  # hub, runs on loopback.
  joint-shell:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      HUB_SRC: ${{ github.workspace }}/.hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          ref: v0.3.3   # pinned; see the note at the top
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: a shell provider behind a real hub
        run: bash scripts/joint-shell.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 /tmp/joint-shell/run/*.log || true

  # Every module end to end (A2A-DESIGN §16, §17 联调): cas, blackboard,
  # org, p2p and evidence across restarts, over wire 2.
  #
  # On request only, and never gating. joint.sh is not yet self-contained:
  # it expects its binaries prebuilt in $J and a hub already running, which
  # this job provides, but also ANetLink's anetlinkd and ANetMock for the
  # device section, which are not in this repository's reach — so the
  # provider's anetlink module fails and most sections go red for a reason
  # outside the diff. When the script builds and starts its own stack and
  # can run without devices (an internal note §4.1), drop the `if` and
  # the continue-on-error.
  joint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CGO_ENABLED: "0"
      J: /tmp/joint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ANetResearch/ANetHub
          ref: v0.3.3   # pinned; see the note at the top
          path: .hub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the binaries joint.sh drives, start the hub
        run: |
          mkdir -p "$J/run"
          go build -o "$J/anet" ./cmd/anet
          go build -o "$J/anetfixture" ./tools/anetfixture
          go build -o "$J/anetpeer" ./tools/anetpeer
          go build -C .hub -o "$J/anet-hub" ./cmd/anet-hub
          cd "$J" && setsid ./anet-hub --addr 127.0.0.1:29088 --data run/hub >run/hub.log 2>&1 </dev/null &
          sleep 2
      - name: every module end to end
        run: bash scripts/joint.sh
      - name: what the nodes logged, if it failed
        if: failure()
        run: tail -n 60 "$J"/run/*.log "$J"/run/*/.anet/daemon.log || true
