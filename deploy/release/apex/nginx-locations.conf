# anet's own files on agentnetwork.org.cn (README.md here).
#
# These locations sit in the 443 server block of the agentnetwork nginx site, in place of the
# site's own `location = /install.sh` and `location = /SKILL.md` and of any proxy for /llms.txt
# and /llms-full.txt. They serve from /var/www/anet-release (publish.sh), which the website's
# deployment — a build of the website's own repository copied into the site root — never writes
# to, so a website deploy can no longer replace the signed installer, the download files, this
# text or site.json.
#
# add_header in a location stops the server block's add_header lines from applying there, so
# no location here has one: every one keeps the server block's security headers. /install.sh,
# /SKILL.md and /site.json get their Cache-Control from `expires epoch` (Cache-Control:
# no-cache, and an Expires in 1970): a browser or proxy revalidates them on every use.

    location = /install.sh {
        alias /var/www/anet-release/install.sh;
        types { } default_type "text/x-shellscript; charset=utf-8";
        expires epoch;
    }
    location = /install.sh.sig {
        alias /var/www/anet-release/install.sh.sig;
    }
    location ^~ /dl/ {
        alias /var/www/anet-release/dl/;
        autoindex off;
    }
    location = /SKILL.md {
        alias /var/www/anet-release/SKILL.md;
        types { } default_type "text/markdown; charset=utf-8";
        expires epoch;
    }
    location = /llms.txt {
        alias /var/www/anet-release/llms.txt;
        types { } default_type "text/plain; charset=utf-8";
    }
    location = /llms-full.txt {
        alias /var/www/anet-release/SKILL.md;
        types { } default_type "text/plain; charset=utf-8";
    }
    # The website's text that changes with anet (install command, the hint for agents): the site
    # reads it at run time, so every page load revalidates it (ETag) instead of keeping a copy.
    location = /site.json {
        alias /var/www/anet-release/site.json;
        types { } default_type "application/json";
        expires epoch;
    }
    # The ZCode marketplace of anet (publish.sh --zcode). The catalogue is revalidated on every use;
    # the archives under plugins/ never change once published (a new version gets a new path).
    location = /zcode/marketplace.json {
        alias /var/www/anet-release/zcode/marketplace.json;
        types { } default_type "application/json";
        expires epoch;
    }
    location ^~ /zcode/ {
        alias /var/www/anet-release/zcode/;
        autoindex off;
    }

    # The plugin catalogues of anet for the other agent tools (publish.sh --plugins).
    # Catalogues, SHA256SUMS and the per-platform archives it lists name the current version
    # and are revalidated on every use; versioned archives never change once published.
    location ^~ /plugins/ {
        root /var/www/anet-release;
        autoindex off;
        location ~ \.json$ {
            types { } default_type "application/json";
            expires epoch;
        }
        location ~ /(SHA256SUMS|(linux|darwin)\.[A-Za-z0-9._-]+\.tar\.gz)$ {
            expires epoch;
        }
    }
