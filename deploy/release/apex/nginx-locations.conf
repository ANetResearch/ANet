# anet's own files on agentnetwork.org.cn (docs/notes/0038).
#
# These locations sit in the 443 server block of /etc/nginx/sites-available/agentnetwork
# on emax, in place of the site's own `location = /install.sh` and `location = /SKILL.md`
# and of the anet-mgmt proxy for /llms.txt and /llms-full.txt. They serve from
# /var/www/anet-release (publish.sh), which the website's deployment — a Vite build of the
# anet-website repository rsynced into /var/www/agentnetwork/public — never writes to, so a
# website deploy can no longer replace the signed installer, the download files or this text.
#
# add_header in a location stops the server block's add_header lines from applying there;
# the locations without one keep the security headers, as they had before the move.

    location = /install.sh {
        alias /var/www/anet-release/install.sh;
        types { } default_type "text/x-shellscript; charset=utf-8";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /install.sh.sig {
        alias /var/www/anet-release/install.sh.sig;
    }
    location ^~ /dl/ {
        alias /var/www/anet-release/dl/;
        autoindex off;
    }
    location = /SKILL.md {
        alias /var/www/anet-release/SKILL.md;
        types { } default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /llms.txt {
        alias /var/www/anet-release/llms.txt;
        types { } default_type "text/plain; charset=utf-8";
    }
    location = /llms-full.txt {
        alias /var/www/anet-release/SKILL.md;
        types { } default_type "text/plain; charset=utf-8";
    }
